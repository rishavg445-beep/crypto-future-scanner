<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futures Pump Scanner</title>
<style>
:root{--bg:#0e1116;--cd:#181d25;--tx:#e8ecf1;--mu:#8b95a3;--ac:#7f93ff;--g:#2fb36b;--r:#e5534b;--a:#e0a43a;--bd:#2a313c}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b1f24;--mu:#5b6573;--ac:#2f4fd8;--bd:#d9dde3}}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;max-width:640px;margin:auto}
h1{font-size:18px;margin:4px 0}.mu{color:var(--mu);font-size:12.5px}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;font-size:13.5px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:9px}
.h{display:flex;justify-content:space-between;align-items:center}.n{font-weight:700;font-size:16px}
.p{background:var(--ac);color:#fff;border-radius:8px;padding:1px 8px;font-size:12.5px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 10px;margin-top:7px;font-size:13px;color:var(--mu)}.g b{color:var(--tx);font-weight:600}
.pl{margin-top:8px;padding:8px;border-radius:8px;border:1px dashed var(--bd);font-size:13px}
.up{color:var(--g)}.dn{color:var(--r)}.am{color:var(--a)}
.warn{font-size:12px;color:var(--mu);margin-top:12px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left}
.err{background:rgba(229,83,75,.12);border:1px solid var(--r);padding:8px;border-radius:8px;font-size:13px;margin:8px 0}
</style></head><body>
<h1>Futures Pump Scanner</h1>
<div class="mu" id="upd">Loading...</div>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<div class="warn">A watchlist, not advice and not a prediction. Pumps are rare and many picks will fail. Prices are converted from USDT at the rate shown. Suggested leverage assumes you accept losing about 20% of your margin if the stop hits. Test on paper first.</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,R=null,tab="picks";
function money(v,cur){if(v==null||isNaN(v))return"-";let x=v,s="";if(cur==="USDT"&&R){x=v*R;s="\u20B9"}else if(cur==="USDT"){s="$"}else s="\u20B9";
 const d=x>=1000?0:x>=100?1:x>=1?2:x>=0.01?4:6;return s+x.toLocaleString("en-IN",{maximumFractionDigits:d})}
const pc=v=>v==null?"-":(v>=0?"+":"")+Number(v).toFixed(1)+"%";
const cl=v=>v>=0?"up":"dn";
const ago=t=>{const m=Math.round((Date.now()/1000-t)/60);return m<60?m+"m ago":m<2880?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
async function getRate(){
 try{const r=await fetch("https://api.coindcx.com/exchange/ticker");const a=await r.json();const x=a.find(t=>t.market==="USDTINR");if(x&&+x.last_price>50)return +x.last_price}catch(e){}
 try{const r=await fetch("https://open.er-api.com/v6/latest/USD");const a=await r.json();if(a.rates&&a.rates.INR)return +a.rates.INR}catch(e){}
 return null}
function picks(){
 if(!D.picks.length)return'<div class="c">No picks right now. Check the Strategy tab for notes.</div>';
 return D.picks.map(p=>`<div class="c"><div class="h"><span class="n">#${p.rank} ${esc(p.coin)}</span><span class="p">score ${p.score}</span></div>
 <div class="g"><span>Price <b>${money(p.price,p.cur)}</b></span><span>24h <b class="${cl(p.chg24)}">${pc(p.chg24)}</b></span>
 <span>Volume vs avg <b>${p.vr}x</b></span><span>Squeeze <b>${p.sq}</b></span>
 <span>Last 4h <b class="${cl(p.mom4)}">${pc(p.mom4)}</b></span><span>Funding <b>${p.fund==null?"-":(p.fund*100).toFixed(4)+"%"}</b></span></div>
 <div class="pl"><div>Entry zone: <b>${money(p.entry_lo,p.cur)}</b> to <b>${money(p.entry_hi,p.cur)}</b></div>
 <div>Stop loss: <b class="dn">${money(p.stop,p.cur)}</b> (risk ${p.risk_pct}%)</div>
 <div>Target 1: <b class="up">${money(p.t1,p.cur)}</b> &nbsp; Target 2: <b class="up">${money(p.t2,p.cur)}</b></div>
 <div class="mu">After T1, move stop to entry. Leverage idea: <b>${p.lev_suggest}x</b> (never above ${p.lev_max}x, or liquidation comes too near the stop).</div></div></div>`).join("")}
function movers(){
 const m=D.movers7d||D.movers_7d||{total:0,caught:0};
 let h=`<div class="c">Last 7 days: <b>${m.total}</b> real movers (up 50%+ in 24h). We had picked <b>${m.caught}</b> of them beforehand.</div>`;
 if(!D.movers.length)return h+'<div class="c">No 50%+ movers recorded yet.</div>';
 return h+'<div class="c t"><table><tr><th>Coin</th><th>24h</th><th>Seen</th><th>Picked first?</th></tr>'+D.movers.map(x=>`<tr><td><b>${esc(x.coin)}</b></td><td class="up">${pc(x.chg24)}</td><td>${ago(x.t)}</td><td>${x.was_picked?"Yes":"No"}</td></tr>`).join("")+"</table></div>"}
function sbox(l,s){const hr=s.n?Math.round(s.hit/s.n*100):0,pr=s.n?Math.round((s.hit+s.partial)/s.n*100):0;
 return `<div class="c"><div class="n">${l}</div><div class="g"><span>Picks graded <b>${s.n}</b></span><span>HIT 50%+ <b class="up">${s.hit} (${hr}%)</b></span>
 <span>PARTIAL 15-49% <b class="am">${s.partial}</b></span><span>MISS <b class="dn">${s.miss}</b></span>
 <span>Avg peak <b>${s.avg_peak}%</b></span><span>Avg dip first <b>${s.avg_dip}%</b></span>
 <span>Plan hit T1 <b>${s.plan_t1}</b></span><span>Plan stopped <b>${s.plan_stop}</b></span>
 <span>Stopped, then pumped <b>${s.shakeout}</b></span><span>Up 15%+ <b>${pr}%</b></span></div></div>`}
function report(){
 let h=sbox("Last 7 days",D.stats.d7)+sbox("Last 30 days",D.stats.d30)+sbox("All time",D.stats.all);
 if(!D.report.length)return h+'<div class="c">Picks are graded 24 hours after they are made. First grades appear tomorrow.</div>';
 return h+'<div class="c t"><table><tr><th>Coin</th><th>Result</th><th>Peak</th><th>Dip</th><th>Plan</th></tr>'+D.report.map(x=>`<tr><td><b>${esc(x.coin)}</b></td><td class="${x.grade==="HIT"?"up":x.grade==="PARTIAL"?"am":"dn"}">${x.grade}</td><td>${pc(x.peak)}</td><td>${pc(x.dip)}</td><td>${x.plan||"-"}</td></tr>`).join("")+"</table></div>"}
function strategy(){
 const s=D.strategy,w=s.weights;
 let h=`<div class="c"><div class="n">Strategy v${s.version}</div><div class="g"><span>Volume weight <b>${w.vol}</b></span><span>Squeeze weight <b>${w.squeeze}</b></span><span>Momentum weight <b>${w.mom}</b></span><span>Funding weight <b>${w.fund}</b></span>
 <span>Stop <b>${s.stop_atr} x ATR</b></span><span>T1 / T2 <b>${s.t1_r}R / ${s.t2_r}R</b></span></div></div>`;
 h+='<div class="c"><div class="n">Nightly reviews</div>'+(D.history.length?D.history.map(x=>`<p><b>${esc(x.date)}</b> ${x.changed?'<span class="up">CHANGED</span>':"kept"} v${x.version}<br><span class="mu">${esc(x.text)}</span></p>`).join(""):'<p class="mu">The first review runs after 11 PM IST.</p>')+"</div>";
 return h}
function show(){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));
 $("out").innerHTML={picks,movers,report,strategy}[tab]()}
async function init(){
 $("tabs").innerHTML=[["picks","Picks"],["movers","Movers"],["report","Report"],["strategy","Strategy"]].map(a=>`<button data-k="${a[0]}">${a[1]}</button>`).join("");
 $("tabs").onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;show()}};
 try{const r=await fetch("data/latest.json?"+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);D=await r.json()}
 catch(e){$("upd").innerHTML='<div class="err">Could not load data/latest.json ('+esc(e.message)+'). The scanner may not have run yet.</div>';return}
 R=await getRate();
 $("upd").textContent="Updated "+D.updated_ist+" | "+D.coins_scanned+" coins scanned | USDT to INR: "+(R?R.toFixed(2):"unavailable (showing USDT)");
 if(D.errors&&D.errors.length)$("upd").insertAdjacentHTML("afterend",'<div class="err">Some data requests failed in the last run. See data/log.txt.</div>');
 show()}
init();
</script></body></html>
