name: Scan
on:
  schedule:
    - cron: "19,48 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scanner
        run: python Scanner.py
      - name: Save data
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "scan $(date -u +'%Y-%m-%d %H:%M')" || echo "nothing to save"
          git push
